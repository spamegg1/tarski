name: Format, build docs, and test
on:
  push:
    branches: [ '*' ]
    tags-ignore:
      - v*

jobs:
  format-build-docs-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8.1.1
    - uses: VirtusLab/scala-cli-setup@v1.18.0
    - run: scala-cli --power format --check && scala-cli --power doc . -f && scala-cli --power test .
