name: Release on Github
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7.0.1
      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          make_latest: true
          generate_release_notes: true
          preserve_order: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
